name: Build NULL200OK_fetch_DomXss

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) جلب Acorn + توليد الأيقونات صراحةً (بدون prepare)
      - name: Prepare assets (Acorn + icons)
        run: node scripts/prepare-assets.js

      # 2) بناء dist/ صراحةً
      - name: Build dist
        run: node scripts/build.js

      # 3) تحقق من أن dist/ موجود فعلاً
      - name: Verify dist exists
        run: |
          ls -la dist/
          test -f dist/manifest.json || (echo "dist/manifest.json missing"; exit 1)

      - name: Verify extension name and version
        run: |
          node -e "
            const m = require('./dist/manifest.json');
            if (m.name !== 'NULL200OK_fetch_DomXss') { console.error('Name mismatch:', m.name); process.exit(1); }
            if (m.version !== '4.0.0') { console.error('Version mismatch:', m.version); process.exit(1); }
            console.log('✓ ' + m.name + ' v' + m.version);
          "

      - name: Syntax check
        run: |
          for f in background.js content/*.js popup/*.js devtools/*.js lib/*.js scripts/*.js; do
            node --check "$f" || exit 1
          done
          echo "✓ JS syntax OK"

      - name: Safe-code guard
        run: |
          if grep -rnE "innerHTML\s*=\s*[^\`'\"]" content/isolated.js popup/ devtools/ 2>/dev/null; then
            echo "ERROR: unsafe innerHTML in trusted code"; exit 1
          fi
          echo "✓ no unsafe innerHTML"

      - name: Package zip
        run: |
          cd dist
          zip -r "../NULL200OK_fetch_DomXss-v4.0.0.zip" .
          cd ..
          ls -la NULL200OK_fetch_DomXss-v4.0.0.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NULL200OK_fetch_DomXss-build
          path: |
            dist/
            NULL200OK_fetch_DomXss-v4.0.0.zip

  test:
    name: Playwright tests
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Xvfb + zip
        run: sudo apt-get update && sudo apt-get install -y xvfb zip

      # نفس الخطوات الصريحة هنا أيضاً
      - name: Prepare assets
        run: node scripts/prepare-assets.js

      - name: Build dist
        run: node scripts/build.js

      - name: Install test deps
        working-directory: tests
        run: npm install

      - name: Install Playwright browser
        working-directory: tests
        run: npx playwright install chromium

      - name: Run tests
        working-directory: tests
        env:
          LAB_L1: ${{ secrets.LAB_L1 }}
          LAB_L2: ${{ secrets.LAB_L2 }}
          LAB_L8: ${{ secrets.LAB_L8 }}
          LAB_L10: ${{ secrets.LAB_L10 }}
        run: xvfb-run --auto-servernum npx playwright test || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/report/
